<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL Lab Publications</title>
    <link rel="stylesheet" href="/CSS/header.css">
    <link rel="stylesheet" href="/CSS/publications.css">
</head>
<body>
    <div id="header"></div>
    <script src="/pages/JS/headerJS.JS"></script>

    <div class="empty"></div>

    <div class="main anim from-bottom"></div>

    <div class="notice anim">
        <div class="innerBox">
            <h1>[Journal Cover Gallery]</h1>
        </div>
    </div>

    <div class="ImgSelect">
        <div class="innerBox">
            <img class="anim delay-1" src="/image/cover1.png" alt="Journal Cover 1">
            <img class="anim delay-2" src="/image/cover2.png" alt="Journal Cover 2">
            <img class="anim delay-3" src="/image/cover3.png" alt="Journal Cover 3">
            <img class="anim delay-4" src="/image/cover4.png" alt="Journal Cover 4">
            <img class="anim delay-5" src="/image/cover5.png" alt="Journal Cover 5">
        </div>
    </div>

    <div class="notice anim from-right">
        <div class="innerBox">
            <h1>[Selected Publications]</h1>
        </div>
    </div>

    <div class="pubList">
        <div class="innerBox">
            <div class="pubItem anim delay-1">
                <div class="pubTitle">
                    <a href="#">Highly Efficient Organic Solar Cells via Novel Acceptor Design</a>
                </div>
                <div class="pubAuthors">Kim J., Lee S., Park H.</div>
                <div class="pubJournal">Nature Energy</div>
                <div class="pubYear">2024</div>
                <div class="pubLinks">
                    <a href="#" class="btn-doi">DOI</a>
                    <a href="#" class="btn-pdf">PDF</a>
                </div>
            </div>

            <div class="pubItem anim delay-2">
                <div class="pubTitle">
                    <a href="#">Perovskite-Based Light-Emitting Diodes with Enhanced Stability</a>
                </div>
                <div class="pubAuthors">Park H., Choi Y., Kim J.</div>
                <div class="pubJournal">Advanced Materials</div>
                <div class="pubYear">2023</div>
                <div class="pubLinks">
                    <a href="#" class="btn-doi">DOI</a>
                    <a href="#" class="btn-pdf">PDF</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/pages/JS/scrollAnimation.js"></script>  
</body>
</html>
